site_name: pyformula
site_description: Arithmetic over your objects as composable, typed formulas, compilable from JSON and described by JSON Schema.
site_url: https://aaltatan.github.io/pyformula/
repo_url: https://github.com/aaltatan/pyformula
repo_name: aaltatan/pyformula
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later

theme:
  name: material
  icon:
    logo: material/function-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Formulas: guide/formulas.md
      - Variables and registries: guide/variables.md
      - Math functions: guide/math.md
      - Numbers, Decimal and rounding: guide/numbers.md
      - Compiling formulas from JSON: guide/compiling.md
      - JSON Schema: guide/json-schema.md
      - With pyspecification: guide/pyspecification.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Expression format: reference/expressions.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/pyformula
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyformula/
