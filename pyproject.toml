[project]
name = "pyformula"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.5.3",
]

[project.scripts]
pyformula = "pyformula:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "devtools>=0.12.2",
    "pyspecification>=0.1.4",
]
