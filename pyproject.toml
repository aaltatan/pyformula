[project]
name = "pyformula"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pyformula = "pyformula:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "devtools>=0.12.2",
    "latexify-py>=0.4.4",
    "pyspecification>=2.0.1",
    "pytest>=9.1.1",
    "pytest-coverage>=0.0",
]
